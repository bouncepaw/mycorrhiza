{{define "title"}}Delete {{beautifulName .HyphaName}}?{{end}}

{{define "body"}}
<main class="main-width">
	<form class="modal" action="/delete/{{.HyphaName}}" method="post">
		<fieldset class="modal__fieldset">
			<legend class="modal__title">
				Delete <a href="/hypha/{{.HyphaName}}">{{beautifulName .HyphaName}}</a>?
			</legend>
			<p class="modal__confirmation-msg">
				Do you really want to delete this hypha?
			</p>
			<p>You cannot undelete a deleted hypha but the history can still be accessed.</p>
			<button type="submit" value="Confirm" class="btn" autofocus>
				Confirm
			</button>
			<a href="/hypha/{{.HyphaName}}" class="btn btn_weak">
				Cancel
			</a>
		</fieldset>
	</form>
</main>
{{end}}
