{{define "title"}}Orphaned hyphae{{end}}
{{define "body"}}
	<main class="main-width">
		<h1>Orphaned hyphae</h1>
		<p>Hyphae which have no backlinks are listed here.</p>
		<ol>
            {{range .Orphans}}
				<li>
					<a class="wikilink" href="/hypha/{{.}}">{{beautifulName .}}</a>
				</li>
            {{end}}
		</ol>
	</main>
{{end}}
