{{define "title"}}Category list{{end}}
{{define "body"}}
	<main class="main-width mv-tags">
		<h1 class="p-name">{{template "title"}}</h1>
        {{if len .Categories}}
			<ol>
                {{range .Categories}}
					<li class="mv-tag">
						<a class="wikilink u-url p-name" href="/category/{{.}}">{{beautifulName .}}</a>
					</li>
                {{end}}
			</ol>
        {{else}}
			<p>This wiki has no categories.</p>
        {{end}}
	</main>
{{end}}
