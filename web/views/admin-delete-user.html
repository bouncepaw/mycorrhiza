{{define "title"}}Delete user {{.U.Name}}?{{end}}
{{define "body"}}
	<main class="main-width form-wrap">
		<h1>Delete user {{.U.Name}}?</h1>

		{{if .Form.HasError}}
			<div class="notice notice--error">
				<strong>Error:</strong>
				{{.Form.Error}}
			</div>
		{{end}}

		<p>Are you sure you want to delete them from the database? This action is irreversible.</p>

		<form action="" method="post">
			<input class="btn btn_destructive" type="submit" value="Delete">
			<a class="btn btn_weak" href="/admin/users/{{.U.Name}}/edit">Cancel</a>
		</form>
	</main>
{{end}}
