{{define "title"}}Backlinks to {{.HyphaName}}{{end}}
{{define "body"}}
<main class="main-width">
	<h1>Backlinks to <a href="/hypha/{{.HyphaName}}">{{beautifulName .HyphaName}}</a></h1>
	<p>Hyphae which have a link to this hypha, embed it as an image or transclude it are listed below.</p>
	<ol>
		{{range .Backlinks}}
		<li>
			<a class="wikilink" href="/hypha/{{.}}">{{beautifulName .}}</a>
		</li>
		{{end}}
	</ol>
</main>
{{end}}
